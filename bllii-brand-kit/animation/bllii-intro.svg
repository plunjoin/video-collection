<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">bllii — 品牌开场</title><defs><linearGradient id="brand" x1="0.08" y1="0.15" x2="0.92" y2="0.55"><stop stop-color="#4B9FFF"/><stop offset=".52" stop-color="#9A83FF"/><stop offset="1" stop-color="#FF89C7"/></linearGradient></defs><style>.intro-symbol{animation:arrive 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:200px 160px}.letter{animation:letter-in .7s cubic-bezier(.2,.8,.2,1) both}.l0{animation-delay:.7s}.l1{animation-delay:.8s}.l2{animation-delay:.9s}.l3{animation-delay:1s}.l4{animation-delay:1.1s}.intro-tagline{animation:tag-in .8s 1.6s both}.intro-accent{animation:accent .8s 1.45s both;transform-box:fill-box;transform-origin:left}.eyes{animation:hello .5s 1.3s both;transform-box:fill-box;transform-origin:center}@keyframes arrive{from{opacity:0;transform:translateX(-65px) scale(.86) rotate(-8deg)}70%{opacity:1;transform:translateX(5px) scale(1.02) rotate(1deg)}to{opacity:1;transform:translateX(0) scale(1) rotate(0)}}@keyframes letter-in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}@keyframes tag-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes accent{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}@keyframes hello{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.12)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(166 126) scale(.76)"><g transform="translate(8 12) scale(.88)"><g class="intro-symbol"><g id="symbol"><g id="speed-lines" fill="#4B9FFF"><rect class="trail trail-a" x="36" y="132" width="60" height="27" rx="13.5" transform="rotate(-7 66 145)"/><circle class="trail trail-b" cx="22" cy="198" r="14"/><rect class="trail trail-c" x="57" y="229" width="47" height="26" rx="13" transform="rotate(-7 80 242)"/></g><g class="core"><path id="play-shell" fill="url(#brand)" fill-rule="evenodd" d="M120 160 C104 112 105 46 133 27 C157 10 179 21 211 36 C254 57 300 83 334 106 C365 127 384 146 380 171 C377 198 351 218 315 239 C277 262 238 281 197 296 C168 307 144 307 131 291 C119 277 122 247 122 218 C122 206 119 201 108 204 L65 210 C43 213 39 181 61 177 L110 170 C120 169 123 167 120 160 Z M158 94 C170 73 187 72 210 84 C242 100 270 117 297 138 C320 156 321 173 297 191 C274 209 247 226 221 239 C201 250 183 247 172 230 C160 211 156 188 153 164 C149 138 146 114 158 94 Z"/><g id="face" fill="#605BBB"><g class="eyes"><rect x="202" y="156" width="21" height="36" rx="10.5" transform="rotate(-12 212 174)"/><rect x="267" y="140" width="21" height="35" rx="10.5" transform="rotate(-12 277 158)"/></g><path d="M238 178 Q247 190 257 174" fill="none" stroke="#605BBB" stroke-width="8" stroke-linecap="round"/></g></g></g></g></g><g transform="translate(384 53)"><g id="wordmark" fill="#353B58"><path class="letter l0" fill-rule="evenodd" d="M27 0 C42 0 54 12 54 27 V79 C63 75 72 72 84 72 C127 72 160 105 160 149 C160 193 127 225 81 225 C35 225 0 194 0 149 V27 C0 12 12 0 27 0 Z M108 149 A28 28 0 1 0 52 149 A28 28 0 1 0 108 149 Z"/><rect class="letter l1" x="173" y="3" width="50" height="222" rx="25"/><rect class="letter l2" x="236" y="0" width="50" height="225" rx="25"/><g class="letter l3"><rect x="302" y="74" width="50" height="151" rx="25"/><circle cx="327" cy="35" r="25" fill="#7B98FF"/></g><g class="letter l4"><rect x="367" y="65" width="50" height="160" rx="25"/><circle cx="392" cy="29" r="25" fill="#FF89C7"/></g></g></g></g><text class="intro-tagline" x="480" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" letter-spacing="4" fill="#747B9A">More Stories, Together</text><rect class="intro-accent" x="441" y="430" width="78" height="4" rx="2" fill="url(#brand)"/></svg>