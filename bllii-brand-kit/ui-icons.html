  <main><header><img src="svg/bllii-horizontal.svg" alt="bllii"><div><h1>功能图标 / UI Icons</h1><p>24 × 24 · 圆润笔画 · 速度短线 · 蓝粉点缀</p></div></header><div class="icons" id="icons"></div></main>
  <script>
    const grid = document.getElementById('icons');
    document.querySelectorAll('symbol').forEach(symbol => {
      const tile = document.createElement('div'); tile.className = 'icon';
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','1.8'); svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
      const use = document.createElementNS('http://www.w3.org/2000/svg','use'); use.setAttribute('href','#'+symbol.id); svg.append(use);
      const label = document.createElement('span'); label.textContent = symbol.id.replace('bllii-',''); tile.append(svg,label); grid.append(tile);
    });
  </script>
