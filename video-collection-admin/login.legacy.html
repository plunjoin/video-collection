<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统管理后台 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h2 class="text-xl font-bold text-white tracking-tight">聚合采集管理系统</h2>
      <p class="text-xs text-slate-400">请输入管理员账号与密码登录控制台</p>
    </div>

    <form id="login-form" onsubmit="doLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-400 font-semibold mb-1.5">用户名</label>
        <input type="text" id="username" required value="admin" placeholder="请输入管理员用户名"
               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm transition">
      </div>
      <div>
        <label class="block text-slate-400 font-semibold mb-1.5">登录密码</label>
        <input type="password" id="password" required value="admin123" placeholder="请输入密码"
               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm transition">
      </div>

      <div id="login-err-msg" class="text-rose-400 text-xs hidden"></div>

      <button type="submit" id="btn-submit"
              class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center">
        立即登录
      </button>

      <div class="text-[11px] text-slate-500 text-center pt-2">
        默认账号: <code class="text-indigo-400 font-mono">admin</code> / 密码: <code class="text-indigo-400 font-mono">admin123</code>
      </div>
    </form>
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const errEl = document.getElementById('login-err-msg');
      const btn = document.getElementById('btn-submit');

      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = '登录验证中...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.code === 1) {
          window.location.href = '/admin/';
        } else {
          errEl.innerText = data.error || '登录失败，请检查账号密码';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        errEl.innerText = '网络连接异常: ' + err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = '立即登录';
      }
    }
  </script>
</body>
</html>
