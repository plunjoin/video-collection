services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: videodb
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在部署环境文件中设置 DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d videodb"]
      interval: 10s
      timeout: 5s
      retries: 10
  # radix/Redis：分布式会话 + 公开读接口缓存（可选，去掉本段与下方 REDIS_ADDR 即为无缓存模式）
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  # 合并后的统一服务：RESTful API + Go 托管的管理后台（/admin，go:embed 内嵌 SPA）
  service:
    build:
      context: .
      dockerfile: video-collection-service/Dockerfile
      args:
        # 构建版本号会打进启动日志与 /status，便于确认线上跑的是哪次构建：
        #   BUILD_VERSION=$(git rev-parse --short HEAD) docker compose build service
        BUILD_VERSION: ${BUILD_VERSION:-}
    restart: unless-stopped
    environment:
      PORT: "8080"
      TZ: Asia/Shanghai
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: video
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      DB_NAME: videodb
      DB_SSLMODE: disable
      # PostgreSQL 连接失败服务直接退出（SQLite 不再作为兜底）；
      # 连接信息亦可经服务内置 SQLite 基础配置（管理后台「基础配置」）维护
      DB_REQUIRE_PRIMARY: "true" # 已废弃：保留仅为兼容旧环境文件，无实际作用
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?请设置管理员初始密码}
      COLLECTION_TEMPLATES_PATH: /app/config/collection_templates.yaml
      COLLECTION_UPLOAD_DIR: /app/data/collection-uploads
      REDIS_ADDR: redis:6379
      REDIS_PREFIX: vc
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - api-data:/app/data
      - api-themes:/app/themes
      - api-players:/app/players
      - ./video-collection-service/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  # 管理后台不再需要独立容器：统一服务已通过 go:embed 托管 /admin，
  # 地址为 http://<host>:${API_PORT:-8080}/admin
  # 前台门户同样内嵌进统一服务二进制（webfront 托管 /，SSR + SPA），
  # 旧的独立 Web 容器（Astro/Node，4321 端口）已废弃移除。
volumes:
  postgres-data:
  redis-data:
  api-data:
  api-themes:
  api-players:
