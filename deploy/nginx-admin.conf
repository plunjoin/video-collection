server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location = /rss.xml { proxy_pass http://api:8080; }
    location = /healthz { proxy_pass http://api:8080; }
    location = /docs { proxy_pass http://api:8080; }
    location = /redoc { proxy_pass http://api:8080; }
    location = /openapi.json { proxy_pass http://api:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
